plugins {
    id 'org.moddingx.modgradle.meta' version '5.1.4'
}

repositories {
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

var dev = System.getenv('IS_DEV')?.toBoolean() ?: false
var releaseType = 'release'
var baseVersion = '26.2'
var jeiVersion = '30.4.0.25'

mod.configure {
    modid 'ultimatools'
    group 'de.melanx'
    versioning {
        if (dev) {
            def gitCommitHash = ['git', 'rev-parse', 'HEAD'].execute().text.trim()
            constant baseVersion + (gitCommitHash ? "-${gitCommitHash}" : '')
        } else {
            base baseVersion
            maven 'https://maven.melanx.de/release'
        }
    }

    neoforge "${baseVersion}.0.7-beta"

    license 'MIT License'
    github 'ChaoticTrials/UltimaTools'

    changelog {
        def lines = defaultChangelog.toString().split('\n')
        def filteredChangelog = lines.findAll { !it.startsWith('- [[meta]') }.join('\n')

        return filteredChangelog
    }

    publishing {
        maven {
            name 'melanx'
            url 'https://maven.melanx.de/release'
            credentials(PasswordCredentials)
        }
    }

    upload {
        all {
            type releaseType
            version '26.2'
        }
        curseforge {
            projectId 315068
        }
        modrinth {
            projectId 'fM4ceeVu'
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-26.2-neoforge:${jeiVersion}"
}
